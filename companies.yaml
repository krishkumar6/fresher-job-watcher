# =============================================================================
# Companies to watch + filters
# =============================================================================
# HOW TO ADD A COMPANY (takes ~1 minute):
#   1. Open the company's careers page and click any job posting.
#   2. Look at the URL of the job board:
#        boards.greenhouse.io/SLUG or job-boards.greenhouse.io/SLUG -> ats: greenhouse
#        jobs.lever.co/SLUG                                         -> ats: lever
#        jobs.ashbyhq.com/SLUG                                      -> ats: ashby
#        jobs.smartrecruiters.com/SLUG                              -> ats: smartrecruiters
#        COMPANY.wdX.myworkdayjobs.com/en-US/SITE                   -> ats: workday (paste full url)
#   3. Add an entry below, then run:  python job_watcher.py --test
#      to confirm it fetches correctly before relying on it.
#
# NOTE: The slugs below are common/likely values — RUN --test ONCE and remove
# or fix any entry that errors. Company career systems change over time.
# =============================================================================

filters:
  # Tuned to Krish's resume: Java / Spring Boot / React full-stack fresher.
  # A job title must contain at least ONE include keyword...
  include_keywords:
    - software engineer
    - software developer
    - java
    - backend
    - back end
    - full stack
    - fullstack
    - full-stack
    - sde
    - graduate
    - trainee
    - associate engineer
    - engineer i
    - engineer 1
    - junior
    - intern
    - apprentice
    - web developer
    - application engineer
  # ...and must NOT contain any of these (filters out senior roles):
  exclude_keywords:
    - senior
    - sr
    - lead
    - staff
    - principal
    - manager
    - architect
    - director
    - head
    - ii
    - iii
    - "2"
    - "3"
    - sde2
    - sde3
  # Location must contain one of these (jobs with no location listed are kept):
  locations:
    - bengaluru
    - bangalore
    - karnataka
    - india
    - remote

