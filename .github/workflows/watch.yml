name: Job Watcher

on:
  schedule:
    # Every 2 hours. GitHub cron is UTC; this covers the whole day IST.
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      ping:
        description: "Just send a test Telegram message (checks credentials)"
        type: boolean
        default: false

permissions:
  contents: write         # needed to commit seen_jobs.json back to the repo

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check config.yaml exists
        if: ${{ !inputs.ping }}
        run: |
          if [ ! -f config.yaml ]; then
            echo "::error::config.yaml is missing. This template ships only"
            echo "::error::config.example.yaml so you don't inherit someone"
            echo "::error::else's filters. Run:  cp config.example.yaml config.yaml"
            echo "::error::then edit it, commit it and push. See README step 4."
            exit 1
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_watcher.py ${{ inputs.ping && '--ping' || '' }}

      - name: Commit updated state
        # Run even if the watcher step failed: successfully-alerted jobs must
        # be persisted as seen; failed ones were un-marked and will retry.
        if: ${{ !cancelled() && !inputs.ping }}
        run: |
          # seen_jobs.json is not committed to the template -- it appears on
          # your first run and is committed from then on. Skip if the watcher
          # crashed before writing it.
          if [ ! -f seen_jobs.json ]; then
            echo "No seen_jobs.json to commit."
            exit 0
          fi
          git config user.name "job-watcher-bot"
          git config user.email "actions@github.com"
          git add seen_jobs.json
          if git diff --cached --quiet; then
            echo "State unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "Update seen jobs [skip ci]"
          # A run takes several minutes. If anything else lands on main in that
          # window -- you editing config.yaml, or an overlapping run -- this
          # push is rejected and the state is lost, so jobs already alerted get
          # alerted again. seen_jobs.json is a set of ids, so the correct
          # resolution is the union of both sides. Merge and retry.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/3) -- merging remote state."
            cp seen_jobs.json /tmp/ours.json
            git fetch origin main
            git reset --hard origin/main
            [ -f seen_jobs.json ] || echo '[]' > seen_jobs.json
            python -c "import json;a=set(json.load(open('/tmp/ours.json')));b=set(json.load(open('seen_jobs.json')));json.dump(sorted(a|b),open('seen_jobs.json','w'),indent=0)"
            git add seen_jobs.json
            if git diff --cached --quiet; then
              echo "Remote already has everything this run saw."
              exit 0
            fi
            git commit -m "Update seen jobs [skip ci]"
          done
          echo "::error::Could not push state after 3 attempts."
          exit 1
