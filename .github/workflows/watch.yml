name: Job Watcher

on:
  schedule:
    # Every 2 hours. GitHub cron is UTC; this covers the whole day IST.
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      ping:
        description: "Just send a test Telegram message (checks credentials)"
        type: boolean
        default: false

permissions:
  contents: write         # needed to commit seen_jobs.json back to the repo

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_watcher.py ${{ inputs.ping && '--ping' || '' }}

      - name: Commit updated state
        # Run even if the watcher step failed: successfully-alerted jobs must
        # be persisted as seen; failed ones were un-marked and will retry.
        if: ${{ !cancelled() && !inputs.ping }}
        run: |
          git config user.name "job-watcher-bot"
          git config user.email "actions@github.com"
          git add seen_jobs.json
          git diff --cached --quiet || git commit -m "Update seen jobs [skip ci]"
          git push
